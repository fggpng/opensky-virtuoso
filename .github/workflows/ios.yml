# App de iOS en un Mac de GitHub (ramas de trabajo): pruebas nativas del núcleo, framework
# OpenSkyCore y OpenSky.ipa sin firmar como artefacto para probarla antes de publicarla.
# En main la compila y la publica el flujo «Compilar y publicar APK» junto al APK.
name: iOS

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versiones de Xcode y del SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Núcleo, proyecto de Xcode e IPA
        run: ios/scripts/build-ipa.sh ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSky-ipa
          path: build/OpenSky.ipa

      - name: Guardar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-ios
          path: |
            core/build/reports/
            build/xcodebuild.log
          if-no-files-found: ignore
