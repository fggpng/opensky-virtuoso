# Compila, prueba y publica un APK firmado en cada push a main.
# Cada ejecución crea la release v1.0.<N> (N = número de ejecución = versionCode).
# La app la detecta en Más → Actualizar la app.
name: Compilar y publicar APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write   # para crear la release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del núcleo (astronomía, protocolo, alineación, simulador)
        run: ./gradlew --no-daemon --stacktrace :core:test

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          OUT="opensky-virtuoso-${VERSION_CODE}.apk"
          cp "$APK" "$OUT"
          {
            git log -1 --pretty=%B
            echo
            echo "Commit: ${GITHUB_SHA::7}"
          } > notes.txt
          gh release create "v1.0.${VERSION_CODE}" "$OUT" \
            --title "OpenSky Virtuoso 1.0.${VERSION_CODE}" \
            --notes-file notes.txt \
            --latest

      - name: Guardar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore
