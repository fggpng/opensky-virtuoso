# Comprueba una rama de trabajo sin publicar nada: pruebas del núcleo y compilación de la app.
# Así un error de compilación nunca llega a main ni gasta un número de versión.
name: Comprobar rama

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del núcleo y compilación de la app
        run: ./gradlew --no-daemon --stacktrace :core:test :app:compileDebugKotlin

      - name: Guardar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            core/build/reports/
            app/build/reports/
